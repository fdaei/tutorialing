# lingospeak network edge — Caddy, the only service that gets a public port.
#
# A compose project separate from the app so `docker compose down` there can't
# take the reverse proxy and TLS certificates with it.
#
# Server invariant:
#   This service alone may publish a port on 0.0.0.0. Every app service joins
#   the external `edge` network and Caddy reaches it by service name, with no
#   `ports:` at all. A service that genuinely needs a host port must bind it as
#   "127.0.0.1:PORT:PORT".
#   (The repo-root docker-compose.yml is for local development and publishes
#    15432/16379/19000/19001 unbound — do not use it that way on this server.)
name: lingospeak-edge

services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: lingospeak-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ACME certificates live here. Do not delete this volume — re-issuing
      # them runs into the Let's Encrypt rate limit.
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    networks:
      edge:
        # These aliases are deliberate and carry no runtime cost.
        # apps/web/src/shared/services/api/config.ts uses one NEXT_PUBLIC_API_URL
        # for both the browser and server-side rendering, and the API's S3
        # adapter calls putObject/headObject against the same public
        # S3_ENDPOINT. Without the aliases both paths would have to leave the
        # container and come back via the server's public IP (hairpin NAT),
        # which is provider-dependent and may not work at all. With them,
        # Docker's internal DNS resolves straight to this Caddy container and
        # TLS still validates, since the SNI is the same name.
        aliases:
          - lingospeak.org
          - www.lingospeak.org
          - storage.lingospeak.org
    healthcheck:
      # Probes the admin API rather than a site path: the config is
      # domain-based and :80 only redirects to HTTPS, and busybox wget has
      # neither --resolve nor a way to skip the staging certificate. The admin
      # listens on localhost:2019 inside the container and is not published.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  caddy_data: {}
  caddy_config: {}

networks:
  # Created by `docker network create edge` (bootstrap.sh, caddy phase).
  # External so it outlives this project's lifecycle.
  edge:
    external: true
